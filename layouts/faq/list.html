{{ define "main" }}
{{ .Content }}
<div class="accordions">
    {{ range .Pages }}
    {{ $faqId := printf "faq-%s" (.File.TranslationBaseName | urlize) }}
    <div class="faq-item accordion">
        <h2 class="faq__title-heading">
            <button
                id="{{ $faqId }}-trigger"
                class="faq__title accordion__title"
                type="button"
                aria-expanded="false"
                aria-controls="{{ $faqId }}-content">
                <span>{{ .Title }}</span>
                <svg class="cross" xmlns="http://www.w3.org/2000/svg" width="27" height="26" viewBox="0 0 27 26" aria-hidden="true">
                    <style>
                        .color {
                            fill: var(--link-color);
                        }
                    </style>
                    <path class="color horizontal" d="M.5 10.92h26v4.16H.5z" />
                    <path class="color vertical" d="M11.42 26V0h4.16v26z" />
                </svg>
            </button>
        </h2>
        <div
            id="{{ $faqId }}-content"
            class="faq__content accordion__content"
            role="region"
            aria-labelledby="{{ $faqId }}-trigger"
            hidden>
            {{ .Content }}
        </div>
    </div>
    {{ end }}
</div>
{{ end }}
